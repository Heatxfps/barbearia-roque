# Barbearia Roque na VPS: app + API + HTTPS automático (Caddy / Let's Encrypt)
# Uso: veja docs/DEPLOY-VPS.md
services:
  roque:
    build: .
    restart: unless-stopped
    env_file: server/.env
    environment:
      # links das mensagens (avaliação, lista de espera, aniversário) seguem o domínio do .env
      URL_APP: https://${DOMINIO:?defina DOMINIO no arquivo .env}
    volumes:
      - dados:/dados        # banco e fotos enviadas pelo painel
    expose:
      - "3333"

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?defina DOMINIO no arquivo .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_dados:/data
      - caddy_config:/config
    depends_on:
      - roque

volumes:
  dados:
  caddy_dados:
  caddy_config:
